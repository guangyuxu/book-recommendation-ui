# Scheduled dependency vulnerability scan (npm audit), kept OFF the per-push/PR blocking path so a
# transient advisory-feed outage never reddens a normal CI run. Complements Dependabot: this
# detects known CVEs in the locked deps; Dependabot opens the PRs that fix them.
name: Audit

on:
  schedule:
    # Weekly, Monday 07:37 UTC (off the :00 mark to avoid the cron stampede, and off the sibling
    # repos' minutes -- agent runs at :17, accounts at :23, service at :29 -- so the four never
    # fire together).
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: make audit
        run: make audit
