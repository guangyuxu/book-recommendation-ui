# Serves the built SPA. The browser calls the backends directly by absolute URL (VITE_API_BASE_URL
# / VITE_CHAT_BASE_URL, CORS-enabled on the backends), so nginx does no API reverse-proxying.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback: every non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
